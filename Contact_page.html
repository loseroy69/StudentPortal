        <div class="wrapper">
		<div class="r_form_wrap">
			
			<div class="title">
				<p>Contact form</p>
			</div>
			
			<!-- Admission from -->
			<div class="r_form">
				<form id="contactForm">
					<div class="input_wrap">
						<label for="yourname">Your Name</label>
						<div class="input_item">
							<i class="fa fa-user" id="icon"></i>
							<input type="text" name="name" class="input" id="yourname" placeholder="Enter your name" required>
						</div>
					</div>
			
					<div class="input_wrap">
						<label for="emailaddress">Email Address</label>
						<div class="input_item">
							<i class="fa fa-envelope" id="icon"></i>
							<input type="email" name="email" class="input" id="emailaddress" placeholder="Enter your email" required>
						</div>
					</div>
			
			
					<div class="input_wrap">
						<label for="message">Message</label>
						<div class="input_item">
							<i class="fa fa-commenting" id="icon"></i>
							<textarea name="message" class="mess" id="message" placeholder="Write your message..." required></textarea>
						</div>
					</div>
			
					<input type="submit" class="button" value="Send Message">
					<input type="reset" class="clear_ad" value="Clear">
				</form>
			</div>
			<script>
				document.getElementById("contactForm").addEventListener("submit", async function (event) {
					event.preventDefault(); // Prevent default form submission
				
					// Get form data
					const name = document.getElementById("yourname").value;
					const email = document.getElementById("emailaddress").value;
					const message = document.getElementById("message").value;
				
					// Simple validation
					if (!name || !email || !message) {
						alert("All fields are required!");
						return;
					}
				
					const formData = { name, email,message };
				
					try {
						const response = await fetch("http://localhost:3000/contacts", {
							method: "POST",
							headers: { "Content-Type": "application/json" },
							body: JSON.stringify(formData)
						});
				
						const result = await response.json();
				
						if (response.ok) {
							alert(result.message);
							document.getElementById("contact_page.html").reset(); // Reset the form after successful submission
						} else {
							alert("Error: " + result.error);
						}
					} catch (error) {
						console.error("Error:", error);
						alert("Failed to submit form");
					}
				});
				</script>
				
			
        </div>
        </div>
    </section>

    <div class="none_div"></div>
   

    
</body>
